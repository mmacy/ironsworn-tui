  - id: attack-shield-wall
    character: arn
    initiative: foe
    situation: "Two raiders hammer at Arn's shield."
    says: "I shove forward with my shield and cut at the nearest raider."
    move: attack
    stat: iron
  - id: fd-shield-up
    character: arn
    initiative: foe
    situation: "A raider is raining blows on Arn with a heavy axe."
    says: "I bring up my shield and stand my ground against his blows."
    move: face_danger
    stat: iron
    tags: [fd-vs-attack]
  - id: attack-killing-blow
    character: arn
