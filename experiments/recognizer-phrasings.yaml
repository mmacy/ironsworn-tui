    move: battle
    stat: shadow
  - id: battle-flank
    character: sefa
    initiative: character
    situation: "The defenders of Thornhold face the attacking clan in open battle."
    says: "I send our spearmen around the hill to take the clan's warriors from the side, and we win the day."
    move: battle
    stat: wits
  - id: fd-boar
    character: kira
    initiative: foe
    situation: "A giant boar charges straight at Kira."
    says: "I dive out of its path."
    move: face_danger
    stat: edge
    tags: [fd-vs-attack]
  - id: fd-flames
    character: sefa
    initiative: foe
    situation: "Raiders set the barn on fire with Sefa inside, while a cultist fights her."
    says: "I run through the flames for the door."
    move: face_danger
    stat: edge
  - id: fd-beam
    character: arn
    initiative: foe
    situation: "A troll is trying to crush Arn under a fallen beam."
    says: "I heave the beam off me with all my strength."
    move: face_danger
    stat: iron
  - id: fd-cart
    character: tovin
    initiative: foe
    situation: "Three raiders are hunting for Tovin through the burning village."
    says: "I hide under the overturned cart and stay still."
    move: face_danger
    stat: shadow
  - id: fd-child
    character: sefa
    initiative: character
    situation: "A raider is dragging a child toward the river while Sefa fights his partner."
    says: "I break away and sprint to grab the child before he reaches the water."
    move: face_danger
    stat: edge
  - id: fd-terror
    character: kira
    initiative: foe
    situation: "A wailing spirit fills Kira's mind with terror as it closes in."
    says: "I steel myself against the fear and stand firm."
    move: face_danger
    stat: heart
  - id: saa-circle
    character: kira
